# CAI Field Manual shell — Hugo module config (chrome defaults only).
# This repo is imported as a module by content repos (e.g.
# CAI-Field-Manual-Hello-World); it is not a runnable site: no content, no
# baseURL, no deploy. Site config (title, baseURL, menus, outputs, markup,
# services, github_repo) and the variant/customize declarations live in the
# importing site, where scripts/check-contracts.sh can validate content
# against them at the site root.

params:
  logo: icons/logo-rh-cai.svg
  offline_search: true
  copyright:
    authors: Project contributors
    from_year: 2026
  footer_center_info: ''
  ui:
    preset: paper
    preset_menu: [paper, slate, ink, terminal]
    dark_mode: true
    section_index: cards
    blog_index: cards
    sidebar_menu_foldable: true
    docs_sidebar_root: home
    sidebar_root_menu: false
    sidebar_icon_policy: none
    docs_section: field-manual
    share: [claude, chatgpt, linkedin, email, copy]
    page_context_menu:
      assistant_links: true

module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.168.0
